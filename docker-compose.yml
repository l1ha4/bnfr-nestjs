services:
  postgres:
    container_name: postgres-bnfr
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bnfr-nestjs

volumes:
  postgres_data:

networks:
  bnfr-nestjs:
